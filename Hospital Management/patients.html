<!DOCTYPE html>
<html>
<head>
    <title>Patients - Aditya Hospital</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f8ff;
        }

        header {
            background-color: #1976d2;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        h2 {
            color: #1976d2;
        }

        input {
            padding: 12px;
            margin: 8px;
            width: 90%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 25px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>ADITYA HOSPITAL</h1>
        <p>Patient Management</p>
    </header>

    <div class="container">

        <h2>Patient Registration</h2>

        <input type="text" placeholder="Patient Name">
        <input type="number" placeholder="Age">
        <input type="text" placeholder="Disease / Problem">
        <input type="text" placeholder="Phone Number">

        <br><br>

        <button>Register Patient</button>

    </div>

</body>
</html>
